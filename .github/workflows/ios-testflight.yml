# Chessenger (Expo) — macOS 26 + Xcode 26 → TestFlight
# 初回: ci/GITHUB_SETUP.md / デスクトップ iOS-Git-リリース手順.md

name: iOS TestFlight Upload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "expo/**"
      - ".github/workflows/ios-testflight.yml"
      - "ci/**"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      SCHEME: chessenger
      PROJECT_PATH: ios/chessenger.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        working-directory: .
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Validate secrets
        working-directory: .
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          SUPA_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r"' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          ISSUER="$(trim "$ISSUER")"
          KEY_ID="$(trim "$KEY_ID")"
          TEAM="$(trim "$TEAM")"
          test -n "$ISSUER" || (echo "APPSTORE_ISSUER_ID が未設定です" && exit 1)
          test -n "$KEY_ID" || (echo "APPSTORE_API_KEY_ID が未設定です" && exit 1)
          test -n "$API_KEY" || (echo "APPSTORE_API_PRIVATE_KEY が未設定です" && exit 1)
          test -n "$TEAM" || (echo "DEVELOPMENT_TEAM が未設定です" && exit 1)
          test -n "$SUPA_URL" || (echo "EXPO_PUBLIC_SUPABASE_URL が未設定です" && exit 1)
          test -n "$SUPA_KEY" || (echo "EXPO_PUBLIC_SUPABASE_ANON_KEY が未設定です" && exit 1)
          echo "APPSTORE_ISSUER_ID_CLEAN=$ISSUER" >> "$GITHUB_ENV"
          echo "APPSTORE_API_KEY_ID_CLEAN=$KEY_ID" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_TEAM_CLEAN=$TEAM" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --non-interactive

      - name: CocoaPods install
        run: |
          cd ios
          pod install --repo-update

      - name: Install App Store Connect API key
        working-directory: .
        env:
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID_CLEAN}.p8"
          CLEAN="$(printf '%s' "$API_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ "$CLEAN" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$CLEAN" > "$KEY_FILE"
          elif printf '%s' "$CLEAN" | base64 -d > "$KEY_FILE" 2>/dev/null && openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            :
          else
            echo "APPSTORE_API_PRIVATE_KEY が不正です"
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          cp "$KEY_FILE" "$HOME/private_keys/AuthKey_${APPSTORE_API_KEY_ID_CLEAN}.p8"
          echo "AUTH_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
          sed "s/__DEVELOPMENT_TEAM__/${DEVELOPMENT_TEAM_CLEAN}/" ci/ExportOptions.plist > /tmp/ExportOptions.plist
          echo "EXPORT_PLIST=/tmp/ExportOptions.plist" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/chessenger.xcarchive"
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM_CLEAN" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID_CLEAN" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID_CLEAN"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export IPA
        run: |
          EXPORT_DIR="$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID_CLEAN" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID_CLEAN"
          IPA="$(find "$EXPORT_DIR" -name '*.ipa' | head -1)"
          test -n "$IPA" || (echo "IPA が見つかりません" && exit 1)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_API_KEY_ID_CLEAN" \
            --apiIssuer "$APPSTORE_ISSUER_ID_CLEAN"

      - name: Summary
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "アップロード完了。App Store Connect → TestFlight で Processing を確認してください。"
          echo "Version: ${VERSION} (build ${{ github.run_number }})"
