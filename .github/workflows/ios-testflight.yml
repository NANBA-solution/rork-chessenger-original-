# Chessenger (Expo) — macOS 26 + Xcode 26 → TestFlight
# 初回: ci/GITHUB_SETUP.md / デスクトップ iOS-Git-リリース手順.md

name: iOS TestFlight Upload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "expo/**"
      - ".github/workflows/ios-testflight.yml"
      - "ci/**"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      SCHEME: chessenger
      WORKSPACE_PATH: ios/chessenger.xcworkspace

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26
        working-directory: .
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Validate secrets
        working-directory: .
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          SUPA_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r"' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          ISSUER="$(trim "$ISSUER")"
          KEY_ID="$(trim "$KEY_ID")"
          TEAM="$(trim "$TEAM")"
          API_KEY="$(trim "$API_KEY")"
          SUPA_URL="$(trim "$SUPA_URL")"
          SUPA_KEY="$(trim "$SUPA_KEY")"
          MISSING=""
          test -n "$ISSUER" || MISSING="$MISSING APPSTORE_ISSUER_ID"
          test -n "$KEY_ID" || MISSING="$MISSING APPSTORE_API_KEY_ID"
          test -n "$API_KEY" || MISSING="$MISSING APPSTORE_API_PRIVATE_KEY"
          test -n "$TEAM" || MISSING="$MISSING DEVELOPMENT_TEAM"
          test -n "$SUPA_URL" || MISSING="$MISSING EXPO_PUBLIC_SUPABASE_URL"
          test -n "$SUPA_KEY" || MISSING="$MISSING EXPO_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::GitHub Secrets が未設定です:$MISSING"
            echo "Settings → Secrets and variables → Actions で登録後、Run workflow を再実行してください。"
            echo "Supabase の値はローカルの expo/.env と同じ本番用を使います。"
            exit 1
          fi
          echo "APPSTORE_ISSUER_ID_CLEAN=$ISSUER" >> "$GITHUB_ENV"
          echo "APPSTORE_API_KEY_ID_CLEAN=$KEY_ID" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_TEAM_CLEAN=$TEAM" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_URL_CLEAN=$SUPA_URL" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY_CLEAN=$SUPA_KEY" >> "$GITHUB_ENV"
          case "$SUPA_URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error::EXPO_PUBLIC_SUPABASE_URL の形式が不正です（https://xxxx.supabase.co である必要があります）"
              exit 1
              ;;
          esac
          case "$SUPA_KEY" in
            eyJ*) ;;
            *)
              echo "::error::EXPO_PUBLIC_SUPABASE_ANON_KEY は JWT（eyJ...）である必要があります"
              exit 1
              ;;
          esac
          SUPA_HOST="$(printf '%s' "$SUPA_URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          echo "Supabase host (trimmed): $SUPA_HOST"

      # xcodebuild の Metro バンドルは .env を読む。未設定だと supabaseClient が起動直後に throw → 審査で crash on launch
      - name: Write production .env
        run: |
          umask 077
          printf '%s\n' \
            "EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL_CLEAN}" \
            "EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY_CLEAN}" \
            > .env
          test -s .env
          echo "Wrote expo/.env ($(wc -l < .env | tr -d ' ') keys, values not logged)"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --non-interactive

      - name: Verify app.config extra has Supabase host
        run: |
          HOST="$(node -p "require('./app.config.js').expo.extra.supabaseUrl.replace(/^https?:\\/\\/([^/]+).*/,'\$1')")"
          test -n "$HOST" || (echo "::error::app.config.js extra.supabaseUrl が空です" && exit 1)
          echo "OK: app.config extra host=$HOST"

      - name: CocoaPods install
        run: |
          cd ios
          pod install

      - name: Install App Store Connect API key
        working-directory: .
        env:
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID_CLEAN}.p8"
          CLEAN="$(printf '%s' "$API_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ "$CLEAN" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$CLEAN" > "$KEY_FILE"
          elif printf '%s' "$CLEAN" | base64 -d > "$KEY_FILE" 2>/dev/null && openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            :
          else
            echo "APPSTORE_API_PRIVATE_KEY が不正です"
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          cp "$KEY_FILE" "$HOME/private_keys/AuthKey_${APPSTORE_API_KEY_ID_CLEAN}.p8"
          echo "AUTH_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
          sed "s/__DEVELOPMENT_TEAM__/${DEVELOPMENT_TEAM_CLEAN}/" ci/ExportOptions.plist > /tmp/ExportOptions.plist
          echo "EXPORT_PLIST=/tmp/ExportOptions.plist" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          MARKETING_VERSION="$(node -p "require('./app.json').expo.version")"
          ARCHIVE_PATH="$RUNNER_TEMP/chessenger.xcarchive"
          # CocoaPods 経由の Expo モジュールは .xcworkspace 必須（.xcodeproj だと modulemap not found → exit 65）
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM_CLEAN" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID_CLEAN" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID_CLEAN"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Verify Supabase env in JS bundle
        run: |
          BUNDLE="$(find "$ARCHIVE_PATH/Products" -name '*.jsbundle' 2>/dev/null | head -1)"
          if [ -z "$BUNDLE" ]; then
            echo "::warning::main.jsbundle が見つかりません（検証スキップ）"
            exit 0
          fi
          HOST="$(printf '%s' "$EXPO_PUBLIC_SUPABASE_URL_CLEAN" | sed -E 's#^https?://([^/]+).*#\1#')"
          KEY_PREFIX="$(printf '%s' "$EXPO_PUBLIC_SUPABASE_ANON_KEY_CLEAN" | cut -c1-12)"
          if [ -z "$HOST" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL が空です"
            exit 1
          fi
          if ! grep -qF "$HOST" "$BUNDLE"; then
            echo "::error::Supabase URL ($HOST) が JS バンドルに埋め込まれていません。起動時クラッシュの原因になります。"
            exit 1
          fi
          if ! grep -qF "$KEY_PREFIX" "$BUNDLE"; then
            echo "::error::Supabase anon key の先頭 ($KEY_PREFIX...) が JS バンドルに見つかりません。TestFlight で Network request failed の原因になります。"
            exit 1
          fi
          echo "OK: Supabase host + anon key prefix found in $(basename "$BUNDLE")"

      - name: Export IPA
        run: |
          EXPORT_DIR="$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID_CLEAN" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID_CLEAN"
          IPA="$(find "$EXPORT_DIR" -name '*.ipa' | head -1)"
          test -n "$IPA" || (echo "IPA が見つかりません" && exit 1)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_API_KEY_ID_CLEAN" \
            --apiIssuer "$APPSTORE_ISSUER_ID_CLEAN"

      - name: Summary
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "アップロード完了。App Store Connect → TestFlight で Processing を確認してください。"
          echo "Version: ${VERSION} (build ${{ github.run_number }})"
