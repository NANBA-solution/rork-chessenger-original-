name: Deploy LP (GitHub Pages)

# LP は Vercel で公開（lp-five-eta.vercel.app）。GitHub Pages 未設定のため push では走らせない。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload LP artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
